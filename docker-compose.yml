services:
  calendar:
    # Build the image from the Dockerfile in the current directory
    build: .

    # Name the container
    container_name: calendar-service

    # Map port 8010 on your machine to port 8010 inside the container
    ports:
      - "8010:8010"

    # Environment variables passed into the container
    environment:
      - CALENDAR_API_TOKEN=${CALENDAR_API_TOKEN:-default-token}
      - TIMEZONE=${TIMEZONE:-Europe/Lisbon}
      - DATABASE_PATH=data/calendar.db

    # Volumes — persist data outside the container on your host disk
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    # Restart automatically if it crashes
    restart: unless-stopped

    # Network for inter-service communication
    networks:
      - edith-network


networks:
  edith-network:
    name: edith-network
    driver: bridge
